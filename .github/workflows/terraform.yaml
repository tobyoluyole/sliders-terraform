name: "Terraform Infrastructure Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to APPLY (staging or production)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read
  pull-requests: write 

jobs:
  plan:
    name: "Plan - ${{ matrix.environment }}"
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    
    env:
      TF_WORKING_DIR: "environments/${{ matrix.environment }}"
      AWS_REGION: "eu-west-1"
      AWS_ROLE_ARN: "arn:aws:iam::323708468663:role/github-actions-terraform-role"

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  apply:
    name: "Apply - ${{ github.event.inputs.environment }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    env:
      TF_WORKING_DIR: "environments/${{ github.event.inputs.environment }}"
      AWS_REGION: "eu-west-1"
      AWS_ROLE_ARN: "arn:aws:iam::323708468663:role/github-actions-terraform-role"

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve